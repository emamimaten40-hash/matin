name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          [ -f .env.example ] || echo "# placeholder" > .env.example
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: goldlux-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK or error log to ci-out branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/*.apk /tmp/out/goldlux-debug.apk 2>/dev/null || true
          grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|> " build.log | head -200 > /tmp/out/errors.txt || true
          tail -400 build.log > /tmp/out/build-tail.log || true
          git checkout --orphan ci-out
          git rm -rfq . > /dev/null
          cp /tmp/out/* .
          git add -A
          git commit -m "CI output [skip ci]"
          git push -f origin ci-out
